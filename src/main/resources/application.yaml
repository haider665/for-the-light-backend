spring:
  application:
    name: for-the-light-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/for_the_light?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.security.web.authentication: TRACE
    org.springframework.security.web.authentication.logout: TRACE
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security.oauth2.client.web: TRACE
    org.springframework.security.oauth2.client.endpoint: TRACE
    org.springframework.security.oauth2.core: TRACE

app:
  custom:
    frontend-uri: ${FRONTEND_URI:http://localhost:5173}
    redirect-uri: ${REDIRECT_URI:http://localhost:5173/dashboard}
  jwt:
    # 32 characters or more for HMAC-SHA256
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e6f9g8h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8}
    expiration: ${JWT_EXPIRATION:3600000} # 1 hour